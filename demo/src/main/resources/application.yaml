spring:
  application:
    name: demo
  datasource:
    # Defaults match docker-compose.yml for local development; override via environment in other setups.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/productdb}
    username: ${DB_USERNAME:product}
    password: ${DB_PASSWORD:product}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
