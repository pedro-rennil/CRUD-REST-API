# Keeps dependencies patched: security fixes and version bumps arrive as pull requests,
# and CI (build, tests, image build) validates each one before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /demo
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
