name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the older, still-running build pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # `verify` runs the unit tests (Surefire) and the *IT classes (Failsafe).
      # The integration and end-to-end tests start PostgreSQL through Testcontainers,
      # which works out of the box because GitHub-hosted Ubuntu runners include Docker.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            demo/target/surefire-reports
            demo/target/failsafe-reports
          if-no-files-found: ignore

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Guards the Dockerfile against drifting out of sync with the project (nothing is pushed).
      - name: Build the image
        run: docker build --tag product-api:ci demo
